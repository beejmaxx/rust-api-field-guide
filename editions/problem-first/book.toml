[book]
title = "Rust API Field Guide · Problem-first"
authors = ["Bijan"]
description = "Learn Rust API design by watching reasonable interfaces fail under new requirements."
language = "en"
src = "src"

[rust]
edition = "2024"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/field-guide.css"]
additional-js = ["theme/edition-switcher.js"]
git-repository-url = "https://github.com/beejmaxx/rust-api-field-guide"
site-url = "/rust-api-field-guide/editions/problem-first/"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
heading-split-level = 2

[output.html.fold]
enable = true
level = 1
