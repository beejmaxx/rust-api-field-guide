[book]
title = "Rust API Field Guide"
authors = ["Bijan"]
description = "Learn idiomatic Rust API design through real interfaces from the standard library and mature open-source projects."
language = "en"
src = "src"

[build]
build-dir = "book"

[rust]
edition = "2024"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/field-guide.css"]
git-repository-url = "https://github.com/beejmaxx/rust-api-field-guide"
edit-url-template = "https://github.com/beejmaxx/rust-api-field-guide/edit/main/{path}"
site-url = "/rust-api-field-guide/"
cname = ""

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.fold]
enable = true
level = 1
